name: Прямой парсинг VLESS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Fetch and parse VLESS
      run: |
        cat > parser.py << 'EOF'
        import re
        import requests
        
        sources = [
            "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_V2Ray.txt",
            "https://raw.githubusercontent.com/alanbobs999/TopFreeProxies/master/Eternity",
        ]
        
        vless_pattern = re.compile(r"vless://[^\s]+")
        all_configs = set()
        
        for url in sources:
            try:
                resp = requests.get(url, timeout=30)
                if resp.status_code == 200:
                    configs = vless_pattern.findall(resp.text)
                    all_configs.update(configs)
                    print(f"✅ {url}: {len(configs)} configs")
            except Exception as e:
                print(f"❌ {url}: {e}")
        
        with open("url_work.txt", "w") as f:
            for config in all_configs:
                f.write(config + "\n")
        
        print(f"\n📊 Total unique VLESS configs: {len(all_configs)}")
        EOF
        
        python3 parser.py
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: vless-configs
        path: url_work.txt
        retention-days: 7
    
    - name: Commit results
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add url_work.txt 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Update VLESS configs $(date '+%Y-%m-%d %H:%M:%S')"
        git push
