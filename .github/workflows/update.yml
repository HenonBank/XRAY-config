name: Автоматическое обновление конфигов

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install aiohttp aiofiles requests
    
    - name: List files (debug)
      run: |
        echo "=== Корень репозитория ==="
        ls -la
        echo "=== Папка script (если есть) ==="
        ls -la script/ 2>/dev/null || echo "Папка script не существует"
        echo "=== Все .py файлы ==="
        find . -name "*.py" -type f
    
    - name: Run parser
      run: |
        # Пробуем разные пути
        if [ -f "beta.py" ]; then
          python beta.py
        elif [ -f "script/beta.py" ]; then
          python script/beta.py
        elif [ -f "src/beta.py" ]; then
          python src/beta.py
        else
          echo "❌ beta.py не найден!"
          echo "📁 Содержимое репозитория:"
          ls -la
          find . -name "*.py"
          exit 1
        fi
